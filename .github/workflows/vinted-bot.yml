name: vinted-deal-bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      skip_scoring:
        description: 'Test mode: skip LLM scoring, fake-pass every new listing'
        type: boolean
        default: false
      full_sweep:
        description: 'Paginate every hunt and score all unseen (slow, expensive)'
        type: boolean
        default: false
      legacy_active_v2:
        description: 'Rescore one bounded batch of active legacy dashboard rows'
        type: boolean
        default: false

concurrency:
  group: vinted-deal-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh to latest main
        run: |
          git fetch origin main
          git checkout --force -B main origin/main
          git log -1 --oneline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: uv sync --project python

      - name: Checkout Vinted CLI
        uses: actions/checkout@v4
        with:
          # Fork includes wardrobe closet fix (catalog?seller_id= was ignored by Vinted).
          repository: rolki-png/vinted-mcp-cli
          path: vinted-mcp-cli

      - name: Build Vinted CLI
        working-directory: vinted-mcp-cli
        run: npm ci && npm run build

      - name: Download Cockroach CA cert
        run: |
          curl --create-dirs -o "$HOME/.postgresql/root.crt" \
            'https://cockroachlabs.cloud/clusters/70432b9f-d784-4414-a25a-25c752c4b17c/cert'

      - name: Choose hunt vs legacy v2 rollout
        env:
          LEGACY_INPUT: ${{ inputs.legacy_active_v2 }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          dispatch = str(os.environ.get("LEGACY_INPUT") or "").lower() in {
              "true",
              "1",
          }
          event = os.environ.get("EVENT_NAME") or ""
          state_path = Path("data/seen_listings.json")
          last = {}
          if state_path.exists():
              state = json.loads(state_path.read_text())
              last = (state.get("legacy_active_v2") or {}).get("last_run") or {}
          remaining = int(last.get("remaining") or 0)
          status = str(last.get("status") or "")
          incomplete = remaining > 0 and status not in {"complete", "exhausted"}
          run_legacy = dispatch or (event == "schedule" and incomplete)
          print(
              f"event={event} dispatch={dispatch} remaining={remaining} "
              f"status={status!r} run_legacy={run_legacy}",
              flush=True,
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"RUN_LEGACY_V2={'true' if run_legacy else 'false'}\n")
          PY

      - name: Run bot
        if: ${{ env.RUN_LEGACY_V2 != 'true' }}
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_GATEWAY_MODEL: ${{ vars.AI_GATEWAY_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SKIP_SCORING: ${{ inputs.skip_scoring }}
          FULL_SWEEP: ${{ inputs.full_sweep }}
          VINTED_BIN: ${{ github.workspace }}/vinted-mcp-cli/dist/cli.js
        run: uv run --project python python python/vinted_bot.py

      - name: Run active legacy v2 rollout
        if: ${{ env.RUN_LEGACY_V2 == 'true' }}
        timeout-minutes: 90
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_GATEWAY_MODEL: ${{ vars.AI_GATEWAY_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VINTED_BIN: ${{ github.workspace }}/vinted-mcp-cli/dist/cli.js
        run: |
          set +e
          uv run --project python python python/backfill_scored_listings.py \
            --legacy-active-v2 --limit 200 --export
          status=$?
          set -e
          echo "LEGACY_ACTIVE_V2_EXIT_CODE=$status" >> "$GITHUB_ENV"
          if [[ "$status" -ne 0 && "$status" -ne 3 ]]; then
            exit "$status"
          fi

      - name: Commit updated state
        run: |
          git config user.name "vinted-bot"
          git config user.email "vinted-bot@users.noreply.github.com"
          git add data/seen_listings.json data/best_deals.json data/best_bundles.json data/bundle_pool.json data/last_run.json data/indexed_scores.json
          if ! git diff --cached --quiet; then
            git commit -m "Update hunt state [skip ci]"
            # Main can move while the bot runs (manual pushes); rebase then push.
            if ! git pull --rebase origin main; then
              echo "Hunt-state rebase conflict; merging legacy progress and keeping this run's score export."
              git show :2:data/seen_listings.json > /tmp/seen_main.json
              git show :3:data/seen_listings.json > /tmp/seen_incoming.json
              python3 python/merge_legacy_state.py /tmp/seen_main.json /tmp/seen_incoming.json data/seen_listings.json
              git checkout --theirs data/indexed_scores.json data/best_deals.json data/best_bundles.json data/bundle_pool.json data/last_run.json || true
              git add data/seen_listings.json data/indexed_scores.json data/best_deals.json data/best_bundles.json data/bundle_pool.json data/last_run.json
              GIT_EDITOR=true git rebase --continue
            fi
            git push
          else
            echo "No state changes to commit"
          fi

      - name: Queue next legacy v2 batch
        if: ${{ always() && env.RUN_LEGACY_V2 == 'true' && env.LEGACY_ACTIVE_V2_EXIT_CODE == '3' }}
        continue-on-error: true
        run: |
          echo "Partial batch; queue the next legacy_active_v2 dispatch."
          curl -fsS -X POST "https://vinted-stuffs.vercel.app/api/trigger" \
            -H "content-type: application/json" \
            -H "user-agent: vinted-deal-bot-requeue" \
            -d '{"legacy_active_v2":true,"full_sweep":false,"skip_scoring":false}'

      - name: Check legacy rollout completion
        if: ${{ always() && env.RUN_LEGACY_V2 == 'true' }}
        run: |
          if [[ "$LEGACY_ACTIVE_V2_EXIT_CODE" -eq 3 ]]; then
            echo "Legacy v2 rollout is partial; the next batch was queued."
            exit 3
          fi
          if [[ "${LEGACY_ACTIVE_V2_STATUS}" == "exhausted" || "${LEGACY_ACTIVE_V2_STUCK:-0}" -gt 0 ]]; then
            echo "Legacy v2 rollout exhausted with ${LEGACY_ACTIVE_V2_STUCK:-0} stuck live row(s) still on the desk. Exit 0 means no retryable gaps remain; inspect those pairs before treating the v2 migration as complete."
            exit 0
          fi
          echo "Legacy v2 rollout is complete."
