<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vinted Hunt Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="page">
    <header class="hero">
      <div>
        <p class="brand">Vinted Hunt</p>
        <h1>Deal desk</h1>
        <p class="lede" id="lede">Loading live snapshot…</p>
      </div>
      <div class="hero-actions">
        <button type="button" id="run-now" class="btn btn-accent">Run hunt</button>
        <button type="button" id="run-sweep" class="btn">Full sweep</button>
        <button type="button" id="refresh" class="btn">Refresh</button>
        <span class="pulse" id="pulse" hidden>live</span>
      </div>
    </header>

    <section class="ops" id="ops">
      <label class="secret-row">
        Dashboard secret
        <input id="dash-secret" type="password" autocomplete="off" placeholder="DASHBOARD_SECRET (stored in this browser only)" />
      </label>
      <p class="ops-msg" id="ops-msg"></p>
    </section>

    <section class="stats" id="stats" aria-label="Run summary"></section>

    <nav class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="finds">Finds</button>
      <button type="button" class="tab" data-tab="bundles">Bundles</button>
      <button type="button" class="tab" data-tab="sellers">Top sellers</button>
      <button type="button" class="tab" data-tab="run">Runs</button>
    </nav>

    <section class="panel active" id="panel-finds">
      <div class="toolbar">
        <label>
          Search
          <input id="q" type="search" placeholder="title, watch, seller…" />
        </label>
        <label>
          Hunt
          <select id="watch"><option value="">All</option></select>
        </label>
        <label>
          Band
          <select id="band">
            <option value="">All</option>
            <option value="steal">steal</option>
            <option value="hunt">hunt</option>
            <option value="acceptable">acceptable</option>
            <option value="skip">skip</option>
          </select>
        </label>
        <label>
          Min score
          <select id="minScore">
            <option value="0" selected>Any</option>
            <option value="6">6+</option>
            <option value="7">7+</option>
            <option value="8">8+</option>
            <option value="9">9+</option>
          </select>
        </label>
        <label>
          Source
          <select id="source">
            <option value="">All</option>
            <option value="keep">kept</option>
            <option value="index">score index</option>
            <option value="scored">last-run top</option>
            <option value="pool">bundle pool</option>
          </select>
        </label>
        <label>
          Sort
          <select id="sort">
            <option value="score-desc">Score ↓</option>
            <option value="score-asc">Score ↑</option>
            <option value="price-asc">Price ↑</option>
            <option value="price-desc">Price ↓</option>
            <option value="date-desc">Newest keep</option>
            <option value="watch">Hunt A–Z</option>
          </select>
        </label>
      </div>
      <p class="count" id="finds-count"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Score</th>
              <th>Band</th>
              <th>Title</th>
              <th>Price</th>
              <th>Hunt</th>
              <th>Seller</th>
              <th>Risk</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="finds-body"></tbody>
        </table>
      </div>
    </section>

    <section class="panel" id="panel-bundles">
      <div id="bundles-root"></div>
    </section>

    <section class="panel" id="panel-sellers">
      <div class="toolbar">
        <label>
          Sort sellers
          <select id="sellerSort">
            <option value="best">Best score</option>
            <option value="avg">Avg score</option>
            <option value="keeps">Keep count</option>
            <option value="listings">Listings</option>
          </select>
        </label>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Seller</th>
              <th>Best</th>
              <th>Avg</th>
              <th>Keeps</th>
              <th>Listings</th>
              <th>Country</th>
              <th>Hunts</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="sellers-body"></tbody>
        </table>
      </div>
    </section>

    <section class="panel" id="panel-run">
      <div id="run-root"></div>
    </section>
  </div>
  <script src="/app.js"></script>
</body>
</html>
